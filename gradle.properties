# base information
projectType              = java-library
projectRootPackageName   = com.github.toolarium.db.changelog
projectGroupId           = com.github.toolarium
projectComponentId       = toolarium
projectDescription       = A lightweight library for automated database schema migrations and rollbacks, providing its own clean database changelog format while supporting import of existing Liquibase and Flyway migrations. It features three-level automated rollback generation, distributed locking and supports all major databases out of the box.
projectUrl               = https://github.com/toolarium/toolarium-db-changelog
licenseText              = MPL 2.0 License
licenseUrl               = https://raw.githubusercontent.com/toolarium/toolarium-db-changelog/main/LICENSE

# tool information
# checkstyleToolVersion    = 13.4.0
# testDependencyVersion    = 5.12.2
sourceCompatibility      = 11
targetCompatibility      = 11

# jvm information
org.gradle.jvmargs       = -Xmx1g -XX:MaxHeapSize=1g -XX:MaxMetaspaceSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.logging.level = quiet
org.gradle.console       = rich
org.gradle.warning.mode  = all
